function limitToCount(s,n){let out="",used=0;for(const ch of s){if(/\s/.test(ch)){if(used<n)out+=ch;continue}if(used>=n)break;out+=ch;used++}return out.trim()}
function endWithFullSentence(s){
 s=s.trim();
 if(!s)return s;
 // 最终句统一以中文句号结束；不截断任何句子。
 return s.replace(/[。！？!?；;，,、…]+$/,"。");
}
